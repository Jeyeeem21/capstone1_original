name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOSTINGER_SSH_HOST: 37.44.245.132
      HOSTINGER_SSH_PORT: "65002"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SSH reachability
        shell: bash
        run: |
          if timeout 20 bash -c "</dev/tcp/$HOSTINGER_SSH_HOST/$HOSTINGER_SSH_PORT"; then
            echo "SSH endpoint is reachable."
          else
            echo "Hostinger SSH endpoint $HOSTINGER_SSH_HOST:$HOSTINGER_SSH_PORT is unreachable from this GitHub runner."
            exit 1
          fi

      - name: Deploy Laravel backend via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.HOSTINGER_SSH_PORT }}
          timeout: 120s
          command_timeout: 30m
          sync: true
          script_stop: true
          script: |
            set -e
            cd /home/u940130461/capstone1

            # Discard any local changes (e.g. permission changes from chmod)
            git checkout -- . || true
            git clean -fd || true

            # Pull latest code
            git pull origin main

            # Install/update PHP dependencies (update handles PHP version differences)
            cd laravel_backend
            composer update --optimize-autoloader --no-dev --quiet

            # Run any new migrations
            php artisan migrate --force
            # php artisan db:seed --force

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:clear
            php artisan view:cache

            # Fix storage permissions
            chmod -R 775 storage bootstrap/cache

            echo "✅ Backend deployed successfully!"
